# `cargo tidy`: deletes the debug and test builds (target/debug), which pile up
# old copies as dependencies and settings change. Release builds and the app's
# data folder (target/release) are kept; the next debug build starts fresh.
[alias]
tidy = "clean --profile dev"

# The compiler's and linker's temporary files stay in the project (.cache/tmp,
# ignored by git) rather than in the system's temp folder on another drive.
[env]
TMP = { value = ".cache/tmp", relative = true }
TEMP = { value = ".cache/tmp", relative = true }
